name: Android Build (xianyu-mobile)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'xianyu-mobile/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: xianyu-mobile-android
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: xianyu-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: xianyu-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head -10

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xianyu-mobile-apk
          path: xianyu-mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
